version: ''

services:
  app:
    build: .
    container_name: nest-chat
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - redis
    environment:
      - MONGO_URI=mongodb://mongo:27018/chat
      - REDIS_URI=redis://redis:6379
    volumes:
      - .:/app
    command: npm run start:dev

  mongo:
    image: mongo:latest
    container_name: mongoMicroservice
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:latest
    container_name: redisMicroservice
    ports:
      - "6379:6379"

volumes:
  mongo-data:
